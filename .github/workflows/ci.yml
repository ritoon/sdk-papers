name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} (format + vet + tests + couverture)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: Contrat généré reproductible
        run: |
          python3 scripts/generate-api.py
          gofmt -w api_*.go
          git diff --exit-code -- 'api_*.go'

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Couverture minimale (99 %)
        run: |
          go tool cover -func=coverage.out
          sh scripts/check-coverage.sh coverage.out

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: ignore

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Installer Gitleaks (version figée)
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Analyser tout l’historique accessible
        run: gitleaks git --redact=100 --log-opts="--all" .
